name: Windows development build

on:
  push:
    branches: [windows]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure x64
        run: cmake -S windows -B windows/build -G "Visual Studio 17 2022" -A x64
      - name: Build x64
        run: cmake --build windows/build --config Release
      - name: Check executable
        shell: pwsh
        run: |
          $exe = "windows/build/Release/FormatWheel.exe"
          if (-not (Test-Path $exe)) { throw "Windows executable was not created" }
          Write-Output "Built: $exe"
