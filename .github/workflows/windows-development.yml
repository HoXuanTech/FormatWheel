name: Windows development build

on:
  push:
    branches: [windows]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure x64
        run: cmake -S windows -B windows/build -G "Visual Studio 17 2022" -A x64
      - name: Build x64
        run: cmake --build windows/build --config Release
      - name: Check executable
        shell: pwsh
        run: |
          $exe = "windows/build/Release/FormatWheel.exe"
          if (-not (Test-Path $exe)) { throw "Windows executable was not created" }
          Write-Output "Built: $exe"
      - name: Convert a PNG to JPEG with Windows Imaging Component
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $inputFile = Join-Path $PWD "windows/build/sample.png"
          $bitmap = [System.Drawing.Bitmap]::new(2, 2)
          $bitmap.SetPixel(0, 0, [System.Drawing.Color]::Red)
          $bitmap.Save($inputFile, [System.Drawing.Imaging.ImageFormat]::Png)
          $bitmap.Dispose()
          $result = Start-Process -FilePath (Join-Path $PWD "windows/build/Release/FormatWheel.exe") -ArgumentList "--run img.to.jpg `"$inputFile`"" -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Image conversion failed with code $($result.ExitCode)" }
          if (-not (Test-Path (Join-Path $PWD "windows/build/sample.jpg"))) { throw "JPEG was not created" }
      - name: Save Windows test executable
        uses: actions/upload-artifact@v4
        with:
          name: FormatWheel-Windows10-development
          path: windows/build/Release/FormatWheel.exe
          if-no-files-found: error
